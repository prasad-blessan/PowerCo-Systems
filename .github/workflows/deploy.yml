# Deploys the PowerCo theme to the live site (https://powerco.free.nf) over FTP
# when theme changes are merged into main (via pull request). The job uses the
# "production" environment, so it waits for a required reviewer to approve.
# Credentials come from repo secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Deploy theme to live site

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/powerco/**'
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://powerco.free.nf
    steps:
      - name: Check FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions > Secrets (Repository secrets)."
              missing=1
            else
              echo "$name is set"
            fi
          done
          exit $missing

      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/themes/powerco/
          server-dir: /htdocs/wp-content/themes/powerco/
          dangerous-clean-slate: false
