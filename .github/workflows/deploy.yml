# Deploys the PowerCo theme to the live site (https://powerco.free.nf) over FTP
# whenever theme files change on main. Credentials come from repo secrets:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Deploy theme to live site

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/powerco/**'
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/themes/powerco/
          server-dir: /htdocs/wp-content/themes/powerco/
          dangerous-clean-slate: false
