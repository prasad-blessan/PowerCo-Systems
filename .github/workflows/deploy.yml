# Deploys the PowerCo theme over FTP:
#   push to `staging` -> "staging" environment    (deploys automatically)
#   push to `main`    -> "production" environment (waits for reviewer approval)
# Each environment holds its own secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# and variable SITE_URL (Settings > Environments > <name>).
name: Deploy theme

on:
  push:
    branches: [main, staging]
    paths:
      - 'wp-content/themes/powerco/**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main' || github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Check FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Environments > ${{ github.ref_name == 'main' && 'production' || 'staging' }}."
              missing=1
            else
              echo "$name is set"
            fi
          done
          echo "Deploying ${{ github.ref_name }} to $SITE_URL"
          exit $missing

      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/themes/powerco/
          server-dir: /htdocs/wp-content/themes/powerco/
          dangerous-clean-slate: false
