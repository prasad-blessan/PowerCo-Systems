# Deploys the PowerCo theme over FTP when theme changes are merged into main.
# One run creates a deploy job per environment; each waits for reviewer approval,
# so "Review deployments" shows both checkboxes: staging and production.
# Approve staging first, test it, then approve production.
# Each environment holds its own secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# and variable SITE_URL (Settings > Environments > <name>).
name: Deploy theme

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/powerco/**'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [staging, production]
    environment:
      name: ${{ matrix.target }}
      url: ${{ vars.SITE_URL }}
    steps:
      - name: Check FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD SITE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set. Add it under Settings > Environments > ${{ matrix.target }}."
              missing=1
            else
              echo "$name is set"
            fi
          done
          echo "Deploying to ${{ matrix.target }}: $SITE_URL"
          exit $missing

      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/themes/powerco/
          server-dir: /htdocs/wp-content/themes/powerco/
          dangerous-clean-slate: false
