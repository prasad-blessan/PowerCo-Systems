<!-- Contact form section -->
<!-- wp:group {"className":"section-wrap section-surface reveal-on-scroll contact-form-wrap"} -->
<div class="wp-block-group section-wrap section-surface reveal-on-scroll contact-form-wrap">
	<!-- wp:heading {"className":"section-title"} --><h2 class="wp-block-heading section-title">Contact Form</h2><!-- /wp:heading -->
	<!-- wp:html -->
	<form action="#" method="post">
		<label>Name
			<input type="text" name="name" required>
		</label>
		<label>Email
			<input type="email" name="email" required>
		</label>
		<label class="full">Subject
			<input type="text" name="subject" required>
		</label>
		<label class="full">Message
			<textarea name="message" rows="5" required></textarea>
		</label>
		<button type="submit">Send Message</button>
	</form>
	<!-- /wp:html -->
</div>
<!-- /wp:group -->
